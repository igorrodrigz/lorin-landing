<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#285c46">
    <meta name="description" content="Guia do usuário da Lórin.">
    <title>Guia do usuário | Lórin</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, system-ui, sans-serif;
        color: #263d34;
        background: #f7f8f3;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        width: min(640px, calc(100% - 40px));
        padding: 40px;
        border: 1px solid #dce2d8;
        border-radius: 20px;
        background: #fff;
      }

      h1 {
        margin-top: 0;
      }

      p {
        color: #667a6d;
        line-height: 1.6;
      }

      a {
        color: #285c46;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Guia do usuário</h1>
      <p>O guia da Lórin será publicado aqui em breve.</p>
      <a href="../">Voltar ao site da Lórin</a>
    </main>
  </body>
</html>
